<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nixie Tube Clocks — project discontinued">
  <title>Nixie Tube Clocks — Discontinued</title>
  <style>
    :root {
      --bg: #0a0908;
      --fg: #e8dcc8;
      --muted: #8a7d68;
      --glow: #ff6b1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse 55% 40% at 50% 42%, rgba(255, 107, 26, 0.12), transparent 70%),
        radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255, 107, 26, 0.04), transparent 50%),
        var(--bg);
      color: var(--fg);
      font-family: "Courier New", Courier, monospace;
      text-align: center;
    }

    main { max-width: 26rem; }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 18px rgba(255, 107, 26, 0.45);
      animation: flicker 4.5s ease-in-out infinite;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.4rem, 5vw, 1.85rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.25;
      text-shadow: 0 0 24px rgba(255, 107, 26, 0.25);
    }

    p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.55; }
      94% { opacity: 1; }
      97% { opacity: 0.7; }
      98% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">2020 – discontinued</p>
    <h1>Nixie Tube Clocks</h1>
    <p>This project is no longer active. Thanks for the interest over the years.</p>
  </main>
</body>
</html>
